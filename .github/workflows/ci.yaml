---
name: CI

on:
  push:
    branches:
      - master
      - 'releases/*'
  pull_request:
    branches:
      - master

env:
  # Must exist on the current macos-latest runner image:
  # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
  DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer

jobs:
  debuggithub:
    name: Debug Github
    runs-on: macos-latest
    steps:
      - name: List available simulators (debug)
        run: xcrun simctl list devices
      - name: List available Runtimes (debug)
        run: xcrun simctl list runtimes
      - name: List available SDKs (debug)
        run: xcodebuild -showsdks
  analyze:
    name: Analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Analyze
        run: make analyze
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Test
        run: make test
  cocoapods:
    name: CocoaPods
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: CocoaPods
        run: make cocoapods
  carthage:
    name: Carthage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Carthage
        run: make carthage
  swift-package-manager:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Verify that PINRemoteImage can be build by SPM
        run: make spm
  example-spm-xcode:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Verify that PINRemoteImage can be build by Xcode's SPM integration
        run: make example
